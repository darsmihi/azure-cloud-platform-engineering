name: Project B - Container Build, Scan & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write   # Required for requesting the OIDC JWT token from GitHub
  contents: read    # Required to check out repository code

jobs:
  build-and-scan:
    name: Build, Scan & Push Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Security Audit
        run: |
          docker build -t app-workload:${{ github.sha }} ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-workload:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Azure Login via Passwordless OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name crccloudplatform295bpq

      - name: Tag and Push Image to ACR
        run: |
          ACR_REGISTRY="crccloudplatform295bpq.azurecr.io"
          docker tag app-workload:${{ github.sha }} $ACR_REGISTRY/azure-cloud-workload:${{ github.sha }}
          docker tag app-workload:${{ github.sha }} $ACR_REGISTRY/azure-cloud-workload:latest
          docker push $ACR_REGISTRY/azure-cloud-workload:${{ github.sha }}
          docker push $ACR_REGISTRY/azure-cloud-workload:latest
        
      - name: Deploy Container to Azure VM (Zero-Downtime)
        run: |
          az vm run-command invoke \
            --resource-group rg-terraform-foundations \
            --name vm-web-lab \
            --command-id RunShellScript \
            --scripts "
              az login --identity
              az acr login --name crccloudplatform295bpq

              # Fetch dynamic secret from Azure Key Vault
              DB_SECRET=\$(az keyvault secret show --vault-name kv-cloud-oubpbo --name db-password --query 'value' -o tsv)

              # Pull latest image
              docker pull crccloudplatform295bpq.azurecr.io/azure-cloud-workload:latest

              # Determine active container color
              if docker ps --format '{{.Names}}' | grep -q 'cloud-app-blue'; then
                NEW_COLOR='green'
                OLD_COLOR='blue'
                NEW_PORT=8082
              else
                NEW_COLOR='blue'
                OLD_COLOR='green'
                NEW_PORT=8081
              fi

              # Clean up any stale instances of the target color
              docker rm -f \"cloud-app-\$NEW_COLOR\" 2>/dev/null || true

              # Start new container on staged port
              docker run -d --name \"cloud-app-\$NEW_COLOR\" \
                --restart always \
                -e APP_ENV=production \
                -e DB_PASSWORD=\"\$DB_SECRET\" \
                -p \$NEW_PORT:8080 \
                crccloudplatform295bpq.azurecr.io/azure-cloud-workload:latest

              # Verify health probe before traffic cutover
              sleep 2
              for i in {1..5}; do
                if curl -s http://127.0.0.1:\$NEW_PORT | grep -q '\"status\": \"healthy\"'; then
                  echo \"Container cloud-app-\$NEW_COLOR is healthy. Cutting over traffic...\"
                  break
                fi
                sleep 2
              done

              # Switch primary port 80 binding to the healthy release
              docker rm -f cloud-app 2>/dev/null || true
              docker run -d --name cloud-app \
                --restart always \
                -e APP_ENV=production \
                -e DB_PASSWORD=\"\$DB_SECRET\" \
                -p 80:8080 \
                crccloudplatform295bpq.azurecr.io/azure-cloud-workload:latest

              # Clean up staged staging instance
              docker rm -f \"cloud-app-\$NEW_COLOR\" 2>/dev/null || true
              docker rm -f \"cloud-app-\$OLD_COLOR\" 2>/dev/null || true
            "